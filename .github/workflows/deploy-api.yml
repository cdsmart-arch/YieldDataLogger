name: Build and deploy API to Hetzner

# Trigger on push to main, or manually via the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'src/YieldDataLogger.Api/**'
      - 'src/YieldDataLogger.Core/**'
      - 'src/YieldDataLogger.Collector/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:   # allows "Run workflow" button in GitHub UI

# All secrets live in GitHub → Settings → Secrets and variables → Actions.
# Required secrets:
#   HETZNER_HOST        - SSH host or IP of the Hetzner VPS (e.g. 1.2.3.4)
#   HETZNER_USER        - SSH user (typically "root" or a deploy user with docker group)
#   HETZNER_SSH_KEY     - Private SSH key (matching one installed on the VPS, ed25519)
# GITHUB_TOKEN is provided automatically and has packages:write for GHCR.

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/yielddatalogger-api
  IMAGE_TAG:  ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Two tags: git SHA (immutable, used for rollback) and "latest" (compose pulls this).
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      # Pull-and-restart on the Hetzner host. Compose reads /etc/ydl.env on the host so the
      # secret never enters this workflow's logs.
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/ydl
            docker compose --env-file /etc/ydl.env pull
            docker compose --env-file /etc/ydl.env up -d
            docker image prune -f
            sleep 5
            curl -fsS http://127.0.0.1:8080/healthz

      - name: Verify
        run: |
          echo "Deployed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Public health: https://<your-hostname>/healthz"
