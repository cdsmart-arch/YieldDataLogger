# YDL deployment (AWS Lightsail, Sydney).
#
# NOTE: originally provisioned on Hetzner, but CNBC/Akamai IP-blocks Hetzner ranges, so the
# live host is now Lightsail (an Akamai-accepted IP). Some docs/secret names still say
# "Hetzner" — that's legacy; the mechanism below is host-agnostic.
#
# Single container. Reuses the existing Dockerfile (Playwright + .NET 8). Data lives on the
# host at /var/lib/ydl/ so container replacements keep history. Auth secret is injected at
# runtime from /etc/ydl.env (see deploy/README.md for provisioning).
#
# Pull-and-restart:
#   docker compose pull && docker compose up -d
#
# Caddy on the host terminates TLS at :443 and reverse-proxies to 127.0.0.1:8080.

services:
  ydl-api:
    # Tag works for both flows:
    #   - First deploy / local: `docker compose build` populates this tag from ./Dockerfile.
    #   - CI deploy: `docker compose pull` fetches the same tag from GHCR (CI pushes it there).
    image: ${YDL_IMAGE:-ghcr.io/cdsma/yielddatalogger-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ydl-api
    restart: unless-stopped
    # Bind to loopback only — Caddy on the host is the public entry point and adds TLS.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Storage__Backend: "sqlite"
      Storage__Sqlite__Enabled: "true"
      Storage__Sqlite__Path: "/data/ydl.sqlite"
      # Disable the Tables backend so the container doesn't try to reach Azurite at boot.
      Storage__Tables__Enabled: "false"
      Auth__Secret: "${YDL_INGEST_SECRET}"
      # Optional outbound proxy for the CnbcPoller's HttpClient. Default empty = direct
      # connection. Set to e.g. "socks5://host.docker.internal:40001" only if you're hosting
      # on a provider whose IP CNBC blocks (Hetzner, OVH, etc.) and you've stood up a
      # SOCKS5 proxy on the host. NOT needed on AWS / Azure / Linode-Akamai / etc.
      Collector__Cnbc__Proxy: "${YDL_CNBC_PROXY:-}"
    extra_hosts:
      # Lets the container resolve `host.docker.internal` to the docker bridge gateway IP,
      # which is needed if you do end up routing CnbcPoller through a host-side proxy.
      # Harmless when unused.
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/lib/ydl:/data
    # Container's appuser (uid 999 in the playwright image) needs write on the volume.
    # The provisioning runbook chowns /var/lib/ydl to that uid:gid.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
